plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.17'
}

// Pandorical splits its environment source sets, so its client-only classes are
// not on the classpath a plain project dependency provides. Resolved here rather
// than inside dependencies{}, where project(...) builds a dependency instead of
// returning the project.
evaluationDependsOn(':pandorical')
def pandoricalClientClasses = project(':pandorical').sourceSets.client.output

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "couch-controls" {
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Pandorical — NavigableScreen, so declarative screens can say where their
    // buttons are, and KeybindManager, so a pad button can drive a server-declared
    // pooled keybind. A soft dependency: this mod runs fine without it (see
    // PandoricalTargets and PandoricalKeybinds), so it is NOT in fabric.mod.json's
    // depends.
    //
    // Two entries because Pandorical splits its environment source sets:
    // NavigableScreen is common API and arrives with the project, while
    // KeybindManager is client-only and has to be named through the client
    // source set's output.
    clientImplementation(project(':pandorical'))
    clientImplementation(pandoricalClientClasses)
}

processClientResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
