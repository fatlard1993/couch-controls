plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.17'
}

// Pandorical splits its environment source sets, so its client-only classes are
// not on the classpath a plain project dependency provides. Resolved here rather
// than inside dependencies{}, where project(...) builds a dependency instead of
// returning the project.
evaluationDependsOn(':pandorical')
def pandoricalClientClasses = project(':pandorical').sourceSets.client.output

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "couch-controls" {
            sourceSet sourceSets.client
        }
    }
}

// Smoke and full gametests, configured once for the whole suite in Pandorical.
apply from: file("../pandorical/gametest.gradle")

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Pandorical: a soft dependency (CouchControls.PANDORICAL_LOADED), so it is not
    // in fabric.mod.json's depends. Two entries because Pandorical splits its
    // environment source sets: common API arrives with the project, client-only
    // classes through the client source set's output.
    clientImplementation(project(':pandorical'))
    clientImplementation(pandoricalClientClasses)
}

// Fabric tests these predicates against the loader's *normalized* game version,
// not Mojang's id: 26.3-snapshot-10 is compared as 26.3-alpha.10. So a floor of
// ">=26.3" is false on every 26.3 snapshot, and writing the obvious thing makes
// the mod refuse to load on the version it was built for. Derived from the pin
// rather than written into the manifest, so the two cannot drift apart.
def mcFloor = project.minecraft_version
    .replaceFirst(/-snapshot-/, '-alpha.')
    .replaceFirst(/-pre-/, '-pre.')
    .replaceFirst(/-rc-/, '-rc.')
// The trailing dash is load-bearing: "<26.4" would still admit 26.4's snapshots,
// because a prerelease sorts below its own release.
def mcParts = mcFloor.tokenize('.-')
def minecraftDependency = ">=${mcFloor} <${mcParts[0]}.${(mcParts[1] as int) + 1}-"
// The +26.3 build tag is ignored in comparison; the floor is the number.
def fabricApiFloor = ">=" + project.fabric_version.replaceFirst(/\+.*$/, '')

processClientResources {
    inputs.property "version", project.version
    inputs.property "minecraftDependency", minecraftDependency
    inputs.property "loaderVersion", project.loader_version
    inputs.property "fabricApiVersion", fabricApiFloor

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraftDependency": minecraftDependency,
               "loaderVersion": project.loader_version,
               "fabricApiVersion": fabricApiFloor
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    // The readme rides in the jar beside the licence, so a server can show it in-game.
    from("README.md") {
        rename { "README_${project.base.archivesName.get()}.md" }
    }
}
